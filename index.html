<!DOCTYPE html>
<html>

<head>
    <title>My Plalist Sorter</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background: darkviolet;
        }

        h1,
        h3 {
            color: lavender;
        }

        .box {
            background-color: darkviolet;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="mb-1">My Playlist Sorter</h1>
        <p class="text-muted mb-4">Sort and label your music playlist using JavaScript array methods.</p>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Song Names</h3>
                <button class="btn btn-primary mr-2" onclick="sortAZ()">Sort A to Z</button>
                <button class="btn btn-primary" onclick="sortZA()">Sort Z to A</button>
                <div id="nameResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Play Counts</h3>
                <button class="btn btn-primary mr-2" onclick="sortLeast()">Least Played First</button>
                <button class="btn btn-primary" onclick="sortMost()">Most Played First</button>
                <div id="countResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Label Every Song Count</h3>
                <button class="btn btn-primary" onclick="addLabel()">Add Plays Label</button>
                <div id="labelResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>
    </div>

    <script>
        var songs = ["Zoom", "Bounce", "Glow", "Rush", "Spark"];
        var plays = [320, 85, 210, 50, 175];

        function updateResults() {
            document.getElementById("nameResult").innerHTML = "Songs: " + songs;
            document.getElementById("countResult").innerHTML = "Plays: " + plays;
            document.getElementById("labelResult").innerHTML = "Press the button above!";
        }

        updateResults();

        function sortAZ() {
            songs.sort();
            document.getElementById("nameResult").innerHTML = "A to Z: " + songs;
        }

        function sortZA() {
            songs.sort();
            songs.reverse();
            document.getElementById("nameResult").innerHTML = "Z to A: " + songs;
        }

        function sortLeast() {
            plays.sort(function (a, b) { return a - b; });
            document.getElementById("countResult").innerHTML = "Least Played First: " + plays;
        }

        function sortMost() {
            plays.sort(function (a, b) { return b - a; });
            document.getElementById("countResult").innerHTML = "Most Played First: " + plays;
        }

        function addLabel() {
            var labeledPlays = plays.map(function (count) {
                return count + " plays";
            });
            document.getElementById("labelResult").innerHTML = "Labelled: " + labeledPlays;
        }
    </script>
</body>

</html>
